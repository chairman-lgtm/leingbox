<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leingbox Finance</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="loginView" class="screen">
    <div class="login-card">
      <div class="brand">LEINGBOX</div>
      <h1>财务记账</h1>
      <p class="muted">请选择账号并输入密码</p>

      <label>账号</label>
      <select id="loginUser">
        <option value="UMO">UMO</option>
        <option value="MARS">MARS</option>
      </select>

      <label>密码</label>
      <input id="loginPassword" type="password" placeholder="请输入密码" />
      <button id="loginBtn" class="primary">进入</button>
      <p id="loginMsg" class="error"></p>

      <div class="note">
        第一版为测试版：第一次使用某个账号时，会让你先设置密码。
        正式上线后建议连接 Supabase Auth，把密码放在云端验证。
      </div>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <header>
      <div>
        <div class="brand small">LEINGBOX</div>
        <h2>财务记账</h2>
      </div>
      <div class="header-actions">
        <span id="currentUser" class="badge"></span>
        <button id="logoutBtn" class="ghost">退出</button>
      </div>
    </header>

    <main>
      <section class="card summary-card">
        <div class="field name-field">
          <label>名字</label>
          <input id="ledgerName" type="text" placeholder="例如：A / 项目名称 / 人名" />
        </div>

        <div class="summary-grid">
          <div class="summary-box">
            <span>总数</span>
            <strong id="totalDisplay">RM 0.00</strong>
          </div>
          <div class="summary-box">
            <span>- 价钱</span>
            <strong id="spentDisplay">RM 0.00</strong>
          </div>
          <div class="summary-box highlight">
            <span>剩多少</span>
            <strong id="remainingDisplay">RM 0.00</strong>
          </div>
        </div>

        <div class="field">
          <label>总数金额（RM）</label>
          <input id="totalAmount" type="number" min="0" step="0.01" placeholder="0.00" />
        </div>
      </section>

      <section class="card">
        <div class="section-title">
          <div>
            <h3>项目</h3>
            <p class="muted">新增、修改或删除后会自动重新计算。</p>
          </div>
          <button id="addItemBtn" class="primary compact">＋ 添加项目</button>
        </div>

        <div id="itemsList" class="items-list"></div>

        <div id="emptyState" class="empty-state">
          还没有项目，点击「＋ 添加项目」开始记录。
        </div>
      </section>

      <section class="card info-card">
        <div>
          <span class="muted">记录数量</span>
          <strong id="itemCount">0</strong>
        </div>
        <div>
          <span class="muted">最后更新</span>
          <strong id="lastUpdated">—</strong>
        </div>
      </section>
    </main>
  </div>

  <template id="itemTemplate">
    <div class="item-row">
      <input class="item-name" type="text" placeholder="项目名称" />
      <div class="money-input">
        <span>RM</span>
        <input class="item-price" type="number" min="0" step="0.01" placeholder="0.00" />
      </div>
      <button class="delete-btn" title="删除">删除</button>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
